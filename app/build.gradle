plugins {
    id 'com.android.application'
}

android {
    namespace 'com.notelock.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.notelock.app'
        minSdk 27
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // One fixed key, so every new build installs over the previous one.
    signingConfigs {
        notelock {
            storeFile file('notelock.keystore')
            storePassword 'notelock'
            keyAlias 'notelock'
            keyPassword 'notelock'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.notelock
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.notelock
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

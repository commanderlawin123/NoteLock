plugins {
    id 'com.android.application'
}

android {
    namespace 'com.notelock.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.notelock.app'
        minSdk 27          // Android 8.1 and newer
        targetSdk 36       // Android 16 (required by Google Play for new apps)
        versionCode 4
        versionName '1.3'
    }

    signingConfigs {
        // Test key (kept in the repo) for APKs you install yourself.
        notelock {
            storeFile file('notelock.keystore')
            storePassword 'notelock'
            keyAlias 'notelock'
            keyPassword 'notelock'
        }
        // Private upload key for Google Play. It comes from GitHub secrets, never from the repo.
        upload {
            def ks = System.getenv('UPLOAD_KEYSTORE_PATH')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('UPLOAD_KEYSTORE_PASSWORD')
                keyAlias System.getenv('UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('UPLOAD_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.notelock
        }
        release {
            minifyEnabled false
            signingConfig System.getenv('UPLOAD_KEYSTORE_PATH') ? signingConfigs.upload : signingConfigs.notelock
        }
    }

    lint {
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.android.billingclient:billing:9.1.0'
    // Keep all Kotlin standard-library pieces (pulled in by billing) on one version
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}

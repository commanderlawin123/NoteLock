name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # APK you install yourself (signed with the test key in the repo)
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Check the APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs app/build/outputs/apk/debug/*.apk | head -3
          $BT/aapt dump badging app/build/outputs/apk/debug/*.apk | grep -E "package:|sdkVersion|targetSdk" || true
      - uses: actions/upload-artifact@v5
        with:
          name: NoteLock-apk
          path: app/build/outputs/apk/debug/*.apk

      # Bundle for Google Play (signed with your private upload key from GitHub secrets)
      - name: Build Play Store bundle (AAB)
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          # Report which secrets this build can see (never their values)
          for n in UPLOAD_KEYSTORE_BASE64 UPLOAD_KEYSTORE_PASSWORD UPLOAD_KEY_PASSWORD UPLOAD_KEY_ALIAS; do
            if [ -n "${!n}" ]; then echo "$n: found"; else echo "::warning::$n: NOT found"; fi
          done
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::warning::Upload key secrets are not set yet. Checking that the bundle builds, but not keeping it."
            ./gradlew bundleRelease --no-daemon
            rm -rf app/build/outputs/bundle
            exit 0
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          ./gradlew bundleRelease --no-daemon
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v5
        with:
          name: NoteLock-play-bundle
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
